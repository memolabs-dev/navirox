name: Actions audit

# zizmor reads the workflow files the way an attacker would: which step can be
# tricked into running someone else's code, which token is wider than the job
# needs, which action is pinned to a moving target. Supabase and n8n both run
# it, which is where the idea came from.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Needed because the action publishes SARIF to the code scanning tab
      # rather than printing a log nobody reads.
      security-events: write
    steps:
      # Pinned to a commit, with the version as a comment for the reader. A tag
      # is a moving target, which is the same thing this job exists to catch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: true
